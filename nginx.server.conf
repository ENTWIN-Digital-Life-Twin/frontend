server {
    listen 80;
    server_name entwin.3utilities.com;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name entwin.3utilities.com;

    ssl_certificate /etc/letsencrypt/live/entwin.3utilities.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/entwin.3utilities.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
