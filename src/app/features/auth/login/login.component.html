<app-auth-shell>
  <app-auth-page-shell>
    <app-auth-heading [eyebrow]="eyebrow()" [title]="title()" [subtitle]="subtitle()" />

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-7 space-y-5" novalidate>
      @if (status() === 'error') {
        <div
          class="flex items-start gap-3 rounded-panel border border-danger/30 bg-danger-light px-4 py-3"
          role="alert"
        >
          <svg lucideInfo class="mt-0.5 h-4 w-4 shrink-0 text-danger" aria-hidden="true"></svg>
          <p class="text-sm leading-relaxed text-danger">{{ errorMessage() }}</p>
        </div>
      }

      <app-field [label]="emailLabel()" [id]="'login-email'" [error]="errorFor('email')">
        <div class="relative">
          <svg
            lucideMail
            class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-ink-faint"
            aria-hidden="true"
          ></svg>
          <input
            appInput
            id="login-email"
            type="email"
            formControlName="email"
            [placeholder]="emailPlaceholder()"
            autocomplete="email"
            class="pl-10"
            [appInputInvalid]="form.controls.email.touched && form.controls.email.invalid"
          />
        </div>
      </app-field>

      <app-field
        [label]="passwordLabel()"
        [id]="'login-password'"
        [error]="errorFor('password')"
      >
        <div class="relative">
          <svg
            lucideLock
            class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-ink-faint"
            aria-hidden="true"
          ></svg>
          <input
            appInput
            id="login-password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            [placeholder]="passwordPlaceholder()"
            autocomplete="current-password"
            class="pl-10 pr-11"
            [appInputInvalid]="form.controls.password.touched && form.controls.password.invalid"
          />
          <button
            type="button"
            class="absolute right-1.5 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-panel text-ink-faint transition-colors duration-200 hover:bg-surface-muted hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/50"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? hidePassword() : showPasswordLabel()"
          >
            @if (showPassword()) {
              <svg lucideEyeOff class="h-4 w-4" aria-hidden="true"></svg>
            } @else {
              <svg lucideEye class="h-4 w-4" aria-hidden="true"></svg>
            }
          </button>
        </div>
      </app-field>

      <div class="flex items-center justify-between gap-4">
        <app-checkbox [(checked)]="rememberMe" [ariaLabel]="rememberMeText()">
          {{ rememberMeText() }}
        </app-checkbox>
        <a
          routerLink="/forgot-password"
          class="text-sm font-medium text-accent-dark transition-colors hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/50 rounded-sm"
        >
          {{ forgotPassword() }}
        </a>
      </div>

      <button
        appButton
        variant="primary"
        type="submit"
        class="w-full"
        size="lg"
        [loading]="status() === 'loading'"
        [disabled]="status() === 'loading' || form.invalid"
      >
        {{ submit() }}
      </button>
    </form>

    <div class="mt-7">
      <div class="relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-line"></div>
        </div>
        <div class="relative flex justify-center text-xs">
          <span class="bg-surface px-3 text-ink-muted">{{ orContinueWith() }}</span>
        </div>
      </div>
    </div>

    <div class="mt-5 grid grid-cols-2 gap-3">
      <button
        type="button"
        appButton
        variant="secondary"
        class="w-full"
        [disabled]="true"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span class="ml-2">Google</span>
      </button>
      <button
        type="button"
        appButton
        variant="secondary"
        class="w-full"
        [disabled]="true"
      >
        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        <span class="ml-2">GitHub</span>
      </button>
    </div>

    <p class="mt-7 text-center text-sm text-ink-muted">
      {{ noAccount() }}
      <a
        routerLink="/register"
        class="font-semibold text-accent-dark transition-colors hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/50 rounded-sm"
      >
        {{ createAccount() }}
      </a>
    </p>
  </app-auth-page-shell>
</app-auth-shell>
